name: Cost Janitor

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-janitor:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,iam,sts
          DEFAULT_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health | grep '\"s3\": \"available\"' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack to be fully ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health | grep -q '"ec2": "available"'; then
              echo "LocalStack is ready."
              break
            fi
            echo "Attempt $i/30 — sleeping 5s..."
            sleep 5
          done
          curl -sf http://localhost:4566/_localstack/health | python3 -m json.tool

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install terraform-local
        run: pip install terraform-local==0.18.0

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          tflocal init -backend=false
          tflocal validate

      - name: Terraform apply (LocalStack)
        working-directory: terraform
        run: |
          tflocal init
          tflocal apply -auto-approve \
            -var="owner=github-actions" \
            -var="environment=staging"
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: janitor/requirements.txt

      - name: Install Janitor dependencies
        run: pip install -r janitor/requirements.txt

      - name: Run Janitor unit tests
        working-directory: janitor
        run: pytest tests/ -v --tb=short

      - name: Run Cost Janitor (dry-run)
        id: janitor
        working-directory: janitor
        run: |
          python janitor.py \
            --endpoint-url http://localhost:4566 \
            --dry-run \
            --output-dir ../samples \
            2>&1 | tee janitor_output.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check janitor exit code
        id: check_orphans
        run: |
          if [ "${{ steps.janitor.outcome }}" = "failure" ]; then
            echo "orphans_found=true" >> $GITHUB_OUTPUT
          else
            echo "orphans_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload cost report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-janitor-report-${{ github.run_number }}
          path: |
            samples/report.json
            samples/report.md
            janitor/janitor_output.log
          retention-days: 30
          if-no-files-found: warn

      - name: Read Markdown report
        id: read_report
        if: github.event_name == 'pull_request' && steps.check_orphans.outputs.orphans_found == 'true'
        run: |
          if [ -f samples/report.md ]; then
            {
              echo 'report_content<<EOF'
              cat samples/report.md
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            echo "report_content=⚠️ report.md was not generated." >> $GITHUB_OUTPUT
          fi

      - name: Post cost report as PR comment
        uses: peter-evans/create-or-update-comment@v4
        if: github.event_name == 'pull_request' && steps.check_orphans.outputs.orphans_found == 'true'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🗑️ Cost Janitor Report

            Orphaned resources were detected in this PR's infrastructure scan.
            **Action required** before merge.

            ${{ steps.read_report.outputs.report_content }}

            ---
            *Generated by [Cost Janitor](.github/workflows/cost-janitor.yml) · Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*

      - name: Fail if orphans detected
        if: steps.check_orphans.outputs.orphans_found == 'true'
        run: |
          echo "::error::Cost Janitor found orphaned resources. Review the report artifact and PR comment."
          echo "::error::To override, add the label 'cost-janitor-override' to the PR."
          exit 1
